<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperFlix Home</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Adicionando mais personalização usando Bootstrap */
        .author-card {
            padding: 20px;
            text-align: center;
            background-color: #fff;
        }
        /* Estilo para os links de redes sociais */
        .social-links a {
            margin: 0 8px;
            color: #007bff;
            text-decoration: none;
        }
        .social-links a:hover {
            text-decoration: underline; /* Efeito de hover nos links */
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>  
    <header class="bg-dark text-white p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" target="_blank" class="navbar-brand text-white"><img src="assets/logo_size.jpg" alt="logo"></a>
            <a href="explorer.html" target="_blank" class="navbar-brand text-white">Explorador</a>
        </div>
    </header>

    <!-- Seção de Séries Populares -->
    <section id="series-populares" class="my-5">
        <div class="container mt-5">
            <h1 class="text-center">Séries Populares</h1>
            <div id="seriesCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
                <div class="carousel-inner" id="carouselContent">
                    <!-- Conteúdo dinâmico será adicionado aqui -->
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#seriesCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#seriesCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Informações do aluno -->
    <section id="sobre" class="my-5 bg-light py-5">
        <div class="container text-center">
            <h2>Informações do aluno</h2>
            <hr>
            <div class="author-card">
                <img src="assets/avatar.webp" id="authorAvatar" alt="Avatar" class="avatar">
                <ul>
                    <li><strong>O site foi criado por:</strong> <span id="authorName"></span></li>
                    <li><strong>Curso:</strong> <span id="authorCourse"></span></li>
                    <li><strong>Turma:</strong> <span id="authorClass"></span></li>
                    <li><strong>Mini-bio:</strong> <span id="authorMinibio"></span></li>
                    <li><strong>Redes sociais:</strong> <span id="authorSocialLinks" class="social-links"></span></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Seção de Séries Recentes -->
    <section id="series-recentes" class="my-5">
        <div class="container">
            <h2 class="mb-4">Séries Recentes</h2>
            <hr>
            <div class="row" id="recent-series-container">
                <!-- Os cards das séries serão gerados aqui dinamicamente -->
            </div>
        </div>
    </section>

    <!-- Seção de Séries Favoritas -->
    <section id="series-favoritas" class="my-5">
        <div class="container">
            <h2 class="mb-4">Séries Favoritas</h2>
            <hr>
            <div class="row" id="favorite-series-container"></div>
        </div>
    </section>

    <script src="scripts.js"></script> <!-- Carrega o script externo -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
