<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SuperFlix - Detalhes do Filme</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="bg-dark text-white p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand text-white">
                <img src="assets/logo_size.jpg" alt="logo">
            </a>
            <a href="explorer.html" class="navbar-brand text-white">Explorador</a>
        </div>
    </header>

    <div class="container my-5">
        <h1 class="mb-4" id="movie-title">Carregando...</h1>
        <div class="section">
            <h2>Informações Gerais</h2>
            <hr>
            <div class="row">
                <div class="col-md-4">
                    <img id="movie-poster" src="" class="img-fluid" alt="Imagem do Filme">
                </div>
                <div class="col-md-8">
                    <p><strong>Descrição:</strong> <span id="movie-description">Carregando...</span></p>
                    <p><strong>Gêneros:</strong> <span id="movie-genres">Carregando...</span></p>
                    <p><strong>País de Origem:</strong> <span id="movie-country">Carregando...</span></p>
                    <p><strong>Ano de Lançamento:</strong> <span id="movie-release-date">Carregando...</span></p>
                    <p><strong>Duração:</strong> <span id="movie-runtime">Carregando...</span></p>
                    <p><strong>Avaliação:</strong> <span id="movie-rating">Carregando...</span></p>
                    <button class="btn btn-primary">Adicionar aos Favoritos</button>
                </div>
            </div>
        </div>
        <div class="elenco">
            <h2>Elenco</h2>
            <hr>
            <div class="row" id="cast-list">
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzOTNhOWFmNWI2YWU4Y2U4ZjQ0NmFlOTUzMmMyMGM2ZSIsIm5iZiI6MTczMzQxNjkwOS40OTYsInN1YiI6IjY3NTFkN2NkNDYyNDM5N2ZhODExNWE3NiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.W5wgoXzmQ2YcVWFEGoVodEaZV4OyrkEtfBCeRu-GbXY';
        const BASE_URL = 'https://api.themoviedb.org/3';

        // Função para buscar os detalhes do filme
        async function fetchMovieDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const MOVIE_ID = urlParams.get('id');  // Obtém o ID do filme a partir da URL

            if (!MOVIE_ID) {
                alert('ID do filme não encontrado!');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/tv/${MOVIE_ID}?language=pt-BR`, {
                    headers: {
                        Authorization: `Bearer ${API_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) throw new Error('Erro ao buscar dados do filme.');

                const data = await response.json();

                // Popula os detalhes gerais
                document.getElementById('movie-title').textContent = data.name || 'Título não disponível';
                document.getElementById('movie-poster').src = data.poster_path
                    ? `https://image.tmdb.org/t/p/w500${data.poster_path}`
                    : 'assets/default-poster.jpg';
                document.getElementById('movie-description').textContent = data.overview || 'Descrição não disponível.';
                document.getElementById('movie-genres').textContent = data.genres.length
                    ? data.genres.map(genre => genre.name).join(', ')
                    : 'Não especificado.';
                document.getElementById('movie-country').textContent = data.production_countries.length
                    ? data.production_countries.map(country => country.name).join(', ')
                    : 'Não especificado.';
                document.getElementById('movie-release-date').textContent = data.next_episode_to_air.air_date || 'Data não disponível.';
                document.getElementById('movie-runtime').textContent = data.next_episode_to_air.runtime
                    ? `${data.next_episode_to_air.runtime} minutos`
                    : 'Não especificado.';
                document.getElementById('movie-rating').textContent = data.vote_average
                    ? `${data.vote_average}/10 (${data.vote_count} votos)`
                    : 'Sem avaliações.';
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar os detalhes do filme.');
            }
        }

        // Função para buscar elenco
        async function fetchCast() {
            const urlParams = new URLSearchParams(window.location.search);
            const MOVIE_ID = urlParams.get('id');

            if (!MOVIE_ID) {
                alert('ID do filme não encontrado!');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/tv/${MOVIE_ID}/credits?language=pt-BR`, {
                    headers: {
                        Authorization: `Bearer ${API_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) throw new Error('Erro ao buscar elenco.');

                const data = await response.json();

                const castList = document.getElementById('cast-list');
                castList.innerHTML = ''; // Limpa conteúdo antigo
                data.cast.slice(0, 10).forEach(actor => {
                    const col = document.createElement('div');
                    col.className = 'col-md-2 cast-member';
                    col.innerHTML = `
                        <img src="${actor.profile_path ? `https://image.tmdb.org/t/p/w200${actor.profile_path}` : 'assets/default-avatar.jpg'}" alt="${actor.name}">
                        <div><strong>${actor.name}</strong></div>
                    `;
                    castList.appendChild(col);
                });
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar elenco.');
            }
        }
        // Função para adicionar aos favoritos
        document.querySelector('.btn.btn-primary').addEventListener('click', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const MOVIE_ID = urlParams.get('id'); // ID da série ou filme

        if (!MOVIE_ID) {
            alert('ID do filme/série não encontrado!');
            return;
        }

        const API_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzOTNhOWFmNWI2YWU4Y2U4ZjQ0NmFlOTUzMmMyMGM2ZSIsIm5iZiI6MTczMzQxNjkwOS40OTYsInN1YiI6IjY3NTFkN2NkNDYyNDM5N2ZhODExNWE3NiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.W5wgoXzmQ2YcVWFEGoVodEaZV4OyrkEtfBCeRu-GbXY'; // Token de API
        const ACCOUNT_ID = 'SEU_ACCOUNT_ID_AQUI'; // Substitua pelo seu ID

        try {
            const response = await fetch(`https://api.themoviedb.org/3/account/${ACCOUNT_ID}/favorite`, {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${API_TOKEN}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    media_type: 'tv', // Tipo de mídia (tv para séries)
                    media_id: MOVIE_ID, // ID da série ou filme
                    favorite: true, // Marcar como favorito
                }),
            });

            if (!response.ok) throw new Error('Erro ao favoritar série/filme.');

            const result = await response.json();
            alert('Série/filme adicionado aos favoritos com sucesso!');
            console.log(result);
        } catch (error) {
            console.error(error);
            alert('Erro ao adicionar série/filme aos favoritos.');
        }
        });

        fetchMovieDetails();
        fetchCast();
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>

</html>
